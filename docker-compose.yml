# Default: single container with SQLite (works offline on a site laptop).
#   docker compose up --build
# PostgreSQL/PostGIS: docker compose --profile postgis up --build
services:
  app:
    build: .
    ports: ["8000:8000"]
    volumes: ["mh-data:/data"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
  db:
    profiles: ["postgis"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: manganese_horizon
      POSTGRES_USER: mh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/postgis_schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports: ["5432:5432"]
volumes:
  mh-data:
  pg-data:
